[project]
name = "CogZ"

[storage]
db_path = ".cogz/cogz.db"

[embedding]
code_model = "BAAI/bge-small-en-v1.5"
knowledge_model = "BAAI/bge-small-en-v1.5"
dimension = 384
nli_model = "cross-encoder/nli-deberta-v3-xsmall"
auto_download = true

[search]
fts_weight = 0.4
vec_weight = 0.6
rrf_k = 60
max_results = 20

[consolidation]
dedup_threshold = 0.92
title_match_threshold = 0.85
contradiction_check = true
promotion_threshold = 3

[index]
allow = []

[context]
default_token_budget = 4096
cold_start_rules = 5
cold_start_observations = 5
task_max_results = 10
task_max_hops = 2
escalation_max_results = 20
escalation_max_hops = 3

[retention]
observation_prune_after_days = 90
tombstone_max_count = 1000
