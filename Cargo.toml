[package]
name = "cogz"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first, code-aware engineering cognition runtime"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Config / Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Embedding / ML
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"] }
tokenizers = "0.21"
hf-hub = { version = "1.0", features = ["blocking"] }

# MCP server
rmcp = { version = "=3.1.4", features = ["transport-io"] }
tokio = { version = "1", features = ["full"] }
schemars = "1"

# File system / Git
git2 = { version = "0.19", default-features = false }
walkdir = "2"
slug = "0.1"
ignore = "0.4"

# Code parsing (Phase 8)
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
globset = "0.4"

# Database
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1"

# Utilities
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zerocopy = "0.8"
ndarray = "0.16"

# Self-update (cogz update)
ureq = { version = "3", features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
filetime = "0.2"
rmcp = { version = "=3.1.4", features = ["transport-io", "client"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
