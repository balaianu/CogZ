[package]
name = "cogz"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first, code-aware engineering cognition runtime"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Config / Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# File system / Git
git2 = { version = "0.19", default-features = false }

# Database
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1"

# Utilities
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zerocopy = "0.8"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
