name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: cogz-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: cogz-aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: cogz-x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: cogz-aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/cogz

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/cogz ${{ matrix.asset_name }}

      - name: Generate checksum
        run: |
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all assets
        uses: actions/download-artifact@v5

      - name: Create SHA256SUMS
        run: |
          # Download all release assets and create a combined checksum file
          # This is done in a separate job because softprops/action-gh-release
          # uploads assets in parallel.
          echo "SHA256SUMS is generated from individual .sha256 files"
          echo "uploaded by the build-and-release job."

      - name: Upload SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
